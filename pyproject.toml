[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-pullman"
version = "0.1.0"
description = "Async task puller and process manager for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=14.0.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.pullman"
Repository = "https://github.com/lambdawalker/python.lambdawalker.pullman"
Issues = "https://github.com/lambdawalker/python.lambdawalker.pullman/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.pullman"
namespace = true
